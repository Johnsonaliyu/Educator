<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sensei dashboard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14171a;--muted:#6b7280;--line:#e5e7eb;--accent:#16a34a;--ub:#dcf8c6;--bb:#fff;--err:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#262c36;--accent:#3fb97a;--ub:#14442f;--bb:#1f262f;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
main{padding:14px 16px 40px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span,.muted{color:var(--muted);font-size:13px}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .top{display:flex;justify-content:space-between;gap:8px}
.row .body{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
#login{max-width:380px;margin:18vh auto 0;padding:0 16px}
#login .err{color:var(--err);min-height:20px;margin:8px 0}
#chat{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#chat.open{display:flex}
#chatHead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#chatBody{flex:1;overflow-y:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--ub)}
.msg.bot{align-self:flex-start;background:var(--bb);border:1px solid var(--line)}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login">
  <h1>Sensei dashboard</h1>
  <p class="muted">Enter your admin password.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="primary" id="loginBtn" style="width:100%">Sign in</button>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Sensei dashboard</h1>
    <div><button id="refresh">Refresh</button> <button id="logout">Log out</button></div>
  </header>
  <main>
    <div class="grid" id="stats"></div>
    <div class="card"><h2>Questions per day (14 days)</h2><div class="bars" id="chart"></div></div>
    <div class="card"><h2>AI used (last 7 days)</h2><div id="providers" class="muted"></div></div>
    <div class="tabs">
      <button id="tabFeed" class="on">Live feed</button>
      <button id="tabUsers">Users</button>
    </div>
    <div id="feedView" class="card"></div>
    <div id="usersView" class="card hidden">
      <input id="search" placeholder="Search name or number">
      <div id="usersList" style="margin-top:8px"></div>
    </div>
  </main>
</div>

<div id="chat">
  <div id="chatHead"><button id="chatBack">Back</button><div><b id="chatName"></b><div class="muted" id="chatPhone"></div></div></div>
  <div id="chatBody"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TZ = "Africa/Lagos";
let pw = sessionStorage.getItem("sensei_pw") || "";
let timer = null;

// Student messages are untrusted text, so everything is escaped before display.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = (d) => new Date(d).toLocaleString("en-GB", { timeZone: TZ, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function ago(d) {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

async function api(params) {
  const r = await fetch("/api/admin?" + new URLSearchParams(params), { headers: { Authorization: "Bearer " + pw } });
  if (r.status === 401) { logout("Wrong password"); throw new Error("auth"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Server error");
  return r.json();
}

function logout(msg) {
  pw = ""; sessionStorage.removeItem("sensei_pw"); clearInterval(timer);
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("loginErr").textContent = typeof msg === "string" ? msg : "";
}

async function login() {
  pw = $("pw").value; $("loginErr").textContent = "";
  if (!pw) return;
  try {
    await loadOverview();
    sessionStorage.setItem("sensei_pw", pw);
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    clearInterval(timer); timer = setInterval(() => !document.hidden && loadOverview().catch(() => {}), 30000);
  } catch (e) { if (e.message !== "auth") $("loginErr").textContent = e.message; }
}

async function loadOverview() {
  const { stats: s, recent } = await api({ view: "overview" });
  $("stats").innerHTML = [
    ["Students", s.total_users], ["New today", s.new_today],
    ["Active today", s.users_today], ["Questions today", s.questions_today],
  ].map(([l, v]) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join("");

  // 14-day chart (fill days with no activity)
  const byDay = Object.fromEntries((s.daily || []).map((d) => [d.day, d.questions]));
  const days = [...Array(14)].map((_, i) => new Date(Date.now() - (13 - i) * 864e5).toLocaleDateString("en-CA", { timeZone: TZ }));
  const max = Math.max(1, ...days.map((d) => byDay[d] || 0));
  $("chart").innerHTML = days.map((d) => {
    const v = byDay[d] || 0;
    return `<div class="bar" title="${d}: ${v}"><span>${v || ""}</span><i style="height:${Math.round((v / max) * 80)}%"></i><span>${d.slice(8)}</span></div>`;
  }).join("");

  const p = s.providers || {};
  $("providers").textContent = Object.keys(p).length ? Object.entries(p).map(([k, v]) => `${k}: ${v}`).join("  ·  ") : "No data yet";

  $("feedView").innerHTML = recent.length ? recent.map((m) => {
    const who = m.users?.name || m.phone;
    return `<div class="row" data-phone="${esc(m.phone)}" data-name="${esc(m.users?.name || "")}">
      <div class="top"><b>${esc(who)}</b><span class="muted">${ago(m.created_at)}</span></div>
      <div class="body">${m.role === "bot" ? "Sensei: " : ""}${esc(m.body)}</div></div>`;
  }).join("") : '<span class="muted">No messages yet. Send your bot a message.</span>';
}

async function loadUsers(q = "") {
  const { users } = await api({ view: "users", q });
  $("usersList").innerHTML = users.length ? users.map((u) => `
    <div class="row" data-phone="${esc(u.phone)}" data-name="${esc(u.name || "")}">
      <div class="top"><b>${esc(u.name || u.phone)}</b><span class="muted">${ago(u.last_seen)}</span></div>
      <div class="body">${esc(u.phone)} · ${u.message_count} questions · joined ${when(u.first_seen)}</div></div>`).join("")
    : '<span class="muted">No users found.</span>';
}

async function openChat(phone, name) {
  $("chatName").textContent = name || phone; $("chatPhone").textContent = phone;
  $("chatBody").innerHTML = '<span class="muted">Loading…</span>';
  $("chat").classList.add("open");
  const { messages } = await api({ view: "chat", phone });
  $("chatBody").innerHTML = messages.map((m) => `<div class="msg ${m.role}">${esc(m.body)}<small>${when(m.created_at)}${m.provider ? " · " + esc(m.provider) : ""}</small></div>`).join("");
  $("chatBody").scrollTop = $("chatBody").scrollHeight;
}

function tab(which) {
  const feed = which === "feed";
  $("tabFeed").classList.toggle("on", feed); $("tabUsers").classList.toggle("on", !feed);
  $("feedView").classList.toggle("hidden", !feed); $("usersView").classList.toggle("hidden", feed);
  if (!feed) loadUsers($("search").value).catch(() => {});
}

$("loginBtn").onclick = login;
$("pw").onkeydown = (e) => e.key === "Enter" && login();
$("logout").onclick = () => logout();
$("refresh").onclick = () => { loadOverview().catch(() => {}); if (!$("usersView").classList.contains("hidden")) loadUsers($("search").value).catch(() => {}); };
$("tabFeed").onclick = () => tab("feed");
$("tabUsers").onclick = () => tab("users");
$("chatBack").onclick = () => $("chat").classList.remove("open");
let t; $("search").oninput = () => { clearTimeout(t); t = setTimeout(() => loadUsers($("search").value).catch(() => {}), 350); };
document.addEventListener("click", (e) => {
  const row = e.target.closest(".row[data-phone]");
  if (row) openChat(row.dataset.phone, row.dataset.name).catch(() => {});
});

if (pw) { $("pw").value = pw; login(); }
</script>
</body>
  </html>
